name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

  postgres-verification:
    name: Migrations and Tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per docs/adr/0012-self-hosted-docker-deployment-and-ci-verification.md,
    # containerized PostgreSQL 18 is the CI merge gate — the same major
    # version pinned for local/self-hosted use (docs/DATABASE_CONVENTIONS.md
    # §2.1). This replaced verification against AWS dev RDS: nothing here
    # calls AWS or needs repository secrets.
    #
    # The service container is a fresh, disposable PostgreSQL 18 server —
    # equivalent to what tests/conftest.py already expects locally. Steps
    # below mirror scripts/verify.sh's `full` stage: migrate empty to head,
    # confirm state, round-trip the downgrade, check seed idempotency,
    # confirm autogenerate produces an empty diff, then run the complete
    # test suite. tests/conftest.py provisions its own ephemeral database
    # off DATABASE_URL for the pytest run, exactly as it does against a
    # developer's local server.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations (empty database to head)
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Verify migration state
        run: uv run alembic -c database/alembic.ini current --verbose

      - name: Test downgrade (full round trip to base)
        run: |
          uv run alembic -c database/alembic.ini downgrade base
          uv run alembic -c database/alembic.ini upgrade head

      - name: Seed idempotency (re-running migrations must not change seeded data)
        # Required by DATABASE_CONVENTIONS.md §25.6. The round trip above
        # already re-ran every seed once; this asserts the result is identical
        # to the seed files, catching a seed that inserts duplicates or drifts
        # from its YAML source.
        run: uv run pytest tests/database/test_seed_idempotency.py -q

      - name: Schema comparison (autogenerate must produce empty diff)
        run: uv run alembic -c database/alembic.ini check

      - name: Run full test suite (unit, database, scenario)
        run: uv run pytest -v --tb=short

  docker-build:
    name: Application image and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds the image compose.yaml's services run from, validates the
    # compose topology, and exercises it end to end: bring up disposable
    # PostgreSQL, wait for it to report healthy, then run the one real
    # containerized job that exists today (Alembic migrations — see
    # Dockerfile and compose.yaml; src/dnd_ai/api has no committed source
    # yet, so there is no API smoke test to run against it).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config

      - name: Build application image
        run: docker compose -f compose.yaml -f compose.ci.yaml build

      - name: Start disposable PostgreSQL and wait for health
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 60 db

      - name: Run migrations against the composed database (smoke test)
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm migrate

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
