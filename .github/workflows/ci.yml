name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Check formatting (ruff)
        run: uv run ruff format --check .
      
      - name: Lint (ruff)
        run: uv run ruff check .
      
      - name: Type check (mypy)
        run: uv run mypy src

  migration-validation:
    name: Migration Validation
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_ai_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Run migrations (empty database to head)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci
        run: |
          uv run alembic -c database/alembic.ini upgrade head
      
      - name: Verify migration state
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci
        run: |
          uv run alembic -c database/alembic.ini current --verbose
      
      - name: Test downgrade (last revision only)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci
        run: |
          uv run alembic -c database/alembic.ini downgrade -1
          uv run alembic -c database/alembic.ini upgrade head
      
      - name: Schema comparison (autogenerate must produce empty diff)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci
        run: |
          uv run alembic -c database/alembic.ini check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Run unit tests (no database)
        run: uv run pytest tests/unit -v --tb=short
      
      - name: Run database tests (testcontainers)
        run: uv run pytest tests/database tests/scenario -v --tb=short
        env:
          # Testcontainers needs Docker socket
          DOCKER_HOST: unix:///var/run/docker.sock
