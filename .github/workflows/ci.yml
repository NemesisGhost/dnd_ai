name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

  postgres-verification:
    name: Migrations and Tests (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Per docs/adr/0012-self-hosted-docker-deployment-and-ci-verification.md,
    # containerized PostgreSQL 18 is the CI merge gate — the same major
    # version pinned for local/self-hosted use (docs/DATABASE_CONVENTIONS.md
    # §2.1). This replaced verification against AWS dev RDS: nothing here
    # calls AWS or needs repository secrets.
    #
    # The service container is a fresh, disposable PostgreSQL 18 server —
    # equivalent to what tests/conftest.py already expects locally. Steps
    # below mirror scripts/verify.sh's `full` stage: migrate empty to head,
    # confirm state, round-trip the downgrade, check seed idempotency,
    # confirm autogenerate produces an empty diff, then run the complete
    # test suite. tests/conftest.py provisions its own ephemeral database
    # off DATABASE_URL for the pytest run, exactly as it does against a
    # developer's local server.
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_ai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dnd_ai_ci

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations (empty database to head)
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Verify migration state
        run: uv run alembic -c database/alembic.ini current --verbose

      - name: Test downgrade (full round trip to base)
        run: |
          uv run alembic -c database/alembic.ini downgrade base
          uv run alembic -c database/alembic.ini upgrade head

      - name: Seed idempotency (re-running migrations must not change seeded data)
        # Required by DATABASE_CONVENTIONS.md §25.6. The round trip above
        # already re-ran every seed once; this asserts the result is identical
        # to the seed files, catching a seed that inserts duplicates or drifts
        # from its YAML source.
        run: uv run pytest tests/database/test_seed_idempotency.py -q

      - name: Schema comparison (autogenerate must produce empty diff)
        run: uv run alembic -c database/alembic.ini check

      - name: Run full test suite (unit, database, scenario)
        run: uv run pytest -v --tb=short

  docker-build:
    name: Application image and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Builds the image compose.yaml's services run from, validates the
    # compose topology, and exercises it end to end: bring up disposable
    # PostgreSQL, wait for it to report healthy, run Alembic migrations
    # (the `migrate` job), then build and start the `api` service and prove
    # it can both answer a liveness check and round-trip the composed
    # database over the compose-internal network — see Dockerfile and
    # compose.yaml.
    #
    # POSTGRES_PASSWORD, MIGRATION_DATABASE_URL, API_DATABASE_URL, and the
    # three API_OIDC_* settings have no fallback default in compose.yaml
    # (see its header comment) — CI must supply all six explicitly, and
    # the two database URLs must agree with POSTGRES_PASSWORD (for
    # `migrate`) or API_READ_WRITE_PASSWORD (for `api`, provisioned below)
    # on the same password. All values are disposable: a fresh
    # tmpfs-backed container per run, never reused, never exposed on a
    # host port, not a real secret. `api` connects as **app_read_write**,
    # never `postgres`/`migration_runner`/`migration_owner` — the same
    # production security boundary compose.yaml's own comment on that
    # service documents; API_DATABASE_URL below reflects that identity,
    # not the migration/superuser one MIGRATION_DATABASE_URL uses. The
    # database URLs address `db` (the compose service name), not
    # `localhost` — `migrate`/`api` reach it over the compose-internal
    # network, not a published host port. The OIDC values are
    # syntactically valid (HTTPS, well-formed — dnd_ai.config requires
    # this since api always runs with DND_AI_ENVIRONMENT=production) but
    # deliberately never resolved against a live identity provider: PyJWT's
    # PyJWKClient fetches lazily, so constructing api's JWKS client at
    # startup makes no network call by itself, and this job's own
    # unauthenticated-request smoke test below never sends a token that
    # would trigger one either.
    env:
      POSTGRES_PASSWORD: ci_disposable_password
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci_disposable_password@db:5432/dnd_ai
      API_READ_WRITE_PASSWORD: ci_disposable_app_read_write_password
      API_DATABASE_URL: postgresql+psycopg://app_read_write:ci_disposable_app_read_write_password@db:5432/dnd_ai
      API_OIDC_ISSUER: https://ci-disposable-idp.example/realm
      API_OIDC_AUDIENCE: dnd-ai-ci-disposable-audience
      API_OIDC_JWKS_URL: https://ci-disposable-idp.example/realm/jwks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        # Needed in this job specifically to run scripts/operations/
        # database_recovery.py's set-role-password below — every other
        # step in this job only ever shells out to `docker compose`.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config

      - name: Verify compose config fails when a required OIDC variable is missing
        # Regression guard for the Phase 10 workstream 11 correction pass:
        # proves API_OIDC_ISSUER/API_OIDC_AUDIENCE/API_OIDC_JWKS_URL truly
        # have no fallback the way POSTGRES_PASSWORD/MIGRATION_DATABASE_URL/
        # API_DATABASE_URL already do — omitting any one of them must fail
        # Compose's own config resolution outright, not silently render an
        # empty string that would only surface later as a runtime 500.
        # `env -u VAR` unsets just that one variable for this command while
        # every other required variable inherited from the job's own `env:`
        # above stays set.
        run: |
          set -e
          for var in API_OIDC_ISSUER API_OIDC_AUDIENCE API_OIDC_JWKS_URL; do
            if env -u "$var" docker compose -f compose.yaml -f compose.ci.yaml config >/dev/null 2>&1; then
              echo "compose config unexpectedly succeeded with $var unset" >&2
              exit 1
            fi
          done
          echo "compose config correctly fails when any required OIDC variable is missing"

      - name: Check CI compose config publishes no db/api port, mounts PostgreSQL 18, and configures api for production
        # Regression guard for issue-2/issue-1, and for the Phase 10
        # workstream 11 correction pass: asserts the *merged, interpolated*
        # config, not just the source YAML (tests/unit/test_compose_files.py
        # already covers the source files without Docker) — see
        # scripts/check_compose_config.py.
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml config --format json \
            | python3 scripts/check_compose_config.py

      - name: Build application image
        # `migrate` carries `profiles: ["tools"]` (compose.yaml), which
        # `docker compose build` — like `up`/`config` — filters out unless
        # named explicitly or activated with `--profile`; `api` carries no
        # such restriction, so a bare `build` would build it alone and
        # silently skip `migrate`. Name both services explicitly so this
        # step actually proves both images build instead of relying on
        # `run --rm migrate`/`up api` below to build them implicitly on
        # first use.
        run: docker compose -f compose.yaml -f compose.ci.yaml build migrate api

      - name: Start disposable PostgreSQL and wait for health
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 60 db

      - name: Run migrations against the composed database (smoke test)
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm migrate

      - name: Provision app_read_write's password (the real deployment path)
        # Exercises the actual documented/scripted provisioning step
        # (docs/DEVELOPMENT.md §3.6, docs/operations/DATABASE_RECOVERY.md's
        # "Provisioning application-role credentials") — not a hand-rolled
        # equivalent — so this job proves the real tool works, not just
        # that *some* SQL could set a password. API_READ_WRITE_PASSWORD is
        # read from this job's own env (see the job-level env: block
        # above), never passed as a --password flag. `--env-file
        # .env.example` is a real, already-committed file
        # database_recovery.py's own argument parsing requires to exist —
        # every line that would set a variable in it is commented out, so
        # it contributes nothing; every value `docker compose` actually
        # needs for interpolation here already comes from this job's own
        # real environment (this job's `env:` block above), which always
        # takes precedence over `--env-file` content regardless — verified
        # directly (`docker compose --env-file .env.example ... config`
        # resolves POSTGRES_PASSWORD from the real environment) before
        # relying on it here.
        run: |
          uv run python scripts/operations/database_recovery.py set-role-password \
            --role app_read_write \
            --password-env-var API_READ_WRITE_PASSWORD \
            --project dnd_ai \
            --env-file .env.example \
            --compose-file compose.yaml \
            --compose-file compose.ci.yaml

      - name: Verify the provisioned password (verify-roles)
        # Confirms the step above actually took, the same way
        # docs/DEVELOPMENT.md §3.6 asks an operator to before starting
        # `api` — fails the job loudly here rather than surfacing only as
        # a mysterious authentication failure several steps later.
        run: |
          uv run python scripts/operations/database_recovery.py verify-roles \
            --project dnd_ai --env-file .env.example --compose-file compose.yaml \
            --compose-file compose.ci.yaml

      - name: Verify app_read_write's live privilege boundaries (the exact deployment credential)
        # Requirement: connect using the exact credential API_DATABASE_URL
        # configures below, prove normal DML works, and prove schema DDL/
        # role management is rejected — against *this job's own* db
        # container (a separate, disposable instance from postgres-
        # verification's own — tests/database/test_app_read_write_role.py
        # covers that job's instance; this covers this one, end to end
        # through the same compose project this job's api service itself
        # connects through). PGPASSWORD is passed as an exec'd-process
        # environment variable, not a psql command-line flag, so it never
        # appears in that process's own argv (`ps`/`docker top`) — even
        # though this is an openly disposable CI-only password already
        # visible in this workflow file's own source, matching the
        # discipline set_role-password itself uses for a real one.
        run: |
          set -e
          echo "-- SELECT works --"
          docker compose -f compose.yaml -f compose.ci.yaml exec -T -e PGPASSWORD="$API_READ_WRITE_PASSWORD" \
            db psql -U app_read_write -d dnd_ai -c "SELECT current_user, count(*) FROM core.worlds;"

          echo "-- CREATE TABLE must be rejected --"
          if docker compose -f compose.yaml -f compose.ci.yaml exec -T -e PGPASSWORD="$API_READ_WRITE_PASSWORD" \
            db psql -U app_read_write -d dnd_ai -c "CREATE TABLE core.ci_privilege_probe (id int);" > /tmp/create_probe.log 2>&1; then
            echo "app_read_write was able to CREATE TABLE — privilege boundary violated" >&2
            cat /tmp/create_probe.log >&2
            exit 1
          fi
          grep -qi "permission denied" /tmp/create_probe.log

          echo "-- SET ROLE migration_owner must be rejected --"
          if docker compose -f compose.yaml -f compose.ci.yaml exec -T -e PGPASSWORD="$API_READ_WRITE_PASSWORD" \
            db psql -U app_read_write -d dnd_ai -c "SET ROLE migration_owner;" > /tmp/setrole_probe.log 2>&1; then
            echo "app_read_write was able to SET ROLE migration_owner — privilege boundary violated" >&2
            cat /tmp/setrole_probe.log >&2
            exit 1
          fi
          grep -qi "permission denied" /tmp/setrole_probe.log

          echo "app_read_write's live privilege boundaries confirmed"

      - name: Start the api service and wait for its own health check
        # /healthz (this service's HEALTHCHECK, compose.yaml) is
        # deliberately DB-independent — proves the container itself boots
        # and Uvicorn answers, not database connectivity (that's the next
        # step). `--wait` blocks until Compose reports it healthy or the
        # timeout is reached, the same mechanism already used for `db`
        # above.
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --wait --wait-timeout 60 api

      - name: Verify the api service reaches the migrated database (smoke test)
        # Proves the full round trip this job exists to check: the built
        # image, Uvicorn, and a real PostgreSQL connection over the
        # compose-internal network all work together — /readyz performs an
        # actual database round trip (dnd_ai.api.app's own docstring), so a
        # non-200 response or a thrown exception here means api can boot
        # but not actually serve traffic. No curl/wget in this image (see
        # compose.yaml's healthcheck comment), so this uses the same
        # Python-standard-library one-liner the container's own
        # HEALTHCHECK does.
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api python -c "
          import urllib.request
          with urllib.request.urlopen('http://localhost:8000/readyz', timeout=5) as resp:
              assert resp.status == 200, resp.status
          print('readyz ok')
          "

      - name: Verify an authenticated route rejects a request with no Authorization header
        # Proves OIDC/authentication wiring is actually active in this exact
        # deployment configuration — get_jwks_client() successfully
        # constructs its client from the now-required DND_AI_OIDC_*
        # settings — without making a live JWKS network request:
        # PyJWKClient fetches lazily, and get_verified_token_claims rejects
        # a request with no Authorization header before ever calling
        # jwks_client.get_signing_key(). Before the Phase 10 workstream 11
        # correction pass, this same request returned a generic 500
        # (config.py's oidc_jwks_url assertion failing, since the container
        # silently ran in "local" mode with no OIDC configured) rather than
        # the fixed 401 contract dnd_ai.api.errors.UnauthorizedError
        # defines. campaign_id in the URL and the body's own IDs are
        # arbitrary, well-formed UUIDs — access resolution never runs far
        # enough to look any of them up, since authentication itself is
        # rejected first.
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api python -c "
          import json
          import urllib.error
          import urllib.request

          body = json.dumps(
              {
                  'world_time_id': '00000000-0000-0000-0000-000000000000',
                  'event_type_code': 'other',
                  'name': 'ci smoke test',
              }
          ).encode()
          request = urllib.request.Request(
              'http://localhost:8000/campaigns/00000000-0000-0000-0000-000000000000/events',
              data=body,
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          else:
              raise AssertionError('expected HTTP 401, got a successful response')
          print('unauthenticated command request correctly rejected with 401')
          "

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v

  persistence-check:
    name: Named volume survives container recreation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Proves the *production* self-hosted volume mechanism from
    # compose.yaml directly — not compose.ci.yaml's disposable tmpfs
    # override — so this deliberately does not pass -f compose.ci.yaml.
    # Runs under a unique Compose project name (COMPOSE_PROJECT_NAME) so it
    # can never collide with, inspect, or delete an unrelated deployment's
    # containers or volumes on the same Docker host; that name also has no
    # published host port (compose.yaml publishes none by design), so
    # everything here goes through `docker compose exec`.
    env:
      COMPOSE_PROJECT_NAME: dnd-ai-persistence-check-${{ github.run_id }}
      POSTGRES_PASSWORD: ci_disposable_password
      # Never actually used — this job only starts `db` — but `docker
      # compose` interpolates every service's environment block up front,
      # regardless of which service is targeted, so `migrate`'s required
      # MIGRATION_DATABASE_URL and `api`'s required API_DATABASE_URL/
      # API_OIDC_* (no fallback default, by design) must still resolve or
      # `up -d db` below fails at config-parsing time before it starts
      # anything.
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:ci_disposable_password@db:5432/dnd_ai
      API_DATABASE_URL: postgresql+psycopg://app_read_write:ci_disposable_password@db:5432/dnd_ai
      API_OIDC_ISSUER: https://ci-disposable-idp.example/realm
      API_OIDC_AUDIENCE: dnd-ai-ci-disposable-audience
      API_OIDC_JWKS_URL: https://ci-disposable-idp.example/realm/jwks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start PostgreSQL and wait for health
        run: docker compose -f compose.yaml up -d --wait --wait-timeout 60 db

      - name: Write a marker row
        run: |
          docker compose -f compose.yaml exec -T db psql -U postgres -d dnd_ai -c \
            "CREATE TABLE persistence_check (marker text); INSERT INTO persistence_check VALUES ('${{ github.run_id }}');"

      - name: Recreate the container without touching the volume
        run: docker compose -f compose.yaml up -d --force-recreate --wait --wait-timeout 60 db

      - name: Confirm the marker survived recreation
        run: |
          RESULT=$(docker compose -f compose.yaml exec -T db psql -U postgres -d dnd_ai -tA -c "SELECT marker FROM persistence_check;" | tr -d '[:space:]')
          echo "Marker after recreation: '$RESULT'"
          if [ "$RESULT" != "${{ github.run_id }}" ]; then
            echo "Marker did not survive container recreation — the named volume is not persisting data as expected"
            exit 1
          fi

      - name: Tear down and remove the volume
        if: always()
        run: docker compose -f compose.yaml down -v

      - name: Confirm the volume was actually removed by 'down -v'
        if: always()
        run: |
          REMAINING=$(docker volume ls -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")
          if [ -n "$REMAINING" ]; then
            echo "Volume(s) left behind after 'down -v': $REMAINING"
            exit 1
          fi
          echo "Confirmed: no volumes remain for project ${COMPOSE_PROJECT_NAME}"
