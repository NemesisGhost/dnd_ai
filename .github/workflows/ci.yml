name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials via OIDC
  contents: read

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src

  aws-verification:
    name: Migrations and Tests (AWS dev)
    runs-on: ubuntu-latest
    # Per docs/PLAN.md §23.0 and §29.9, migrations and tests/database /
    # tests/scenario verify against the deployed AWS dev RDS instance rather
    # than a service-container stand-in. The mechanism itself — ephemeral
    # per-run database creation (scripts/ci_ephemeral_database.py) and
    # scoped security-group ingress (scripts/aws-db-allow-my-ip.sh and the
    # steps below) — is built and has run successfully in GitHub Actions,
    # including run 30765722355 (create database, migrate to head, alembic
    # check, seed idempotency, full test suite, drop database, revoke
    # ingress). It depends on the following configured GitHub Actions
    # secrets/variables:
    #   - vars.AWS_REGION, vars.DEV_DB_SECURITY_GROUP_ID
    #   - secrets.AWS_CI_ROLE_ARN — an IAM role trusting GitHub's OIDC
    #     provider, scoped to ec2:AuthorizeSecurityGroupIngress /
    #     RevokeSecurityGroupIngress on that one security group
    #   - secrets.DEV_DB_ADMIN_URL — a full connection string (scheme
    #     postgresql+psycopg://...) for a role with CREATEDB on the dev
    #     instance. The bootstrap revision's six roles are still scoped to
    #     schema-level DDL/DML with none holding CREATEDB (INFRASTRUCTURE.md
    #     §11 item 8); today this points at the RDS master user, which does
    #     have the necessary privilege — a dedicated, narrower CI role is
    #     still worth creating before this runs unattended in prod-adjacent
    #     environments.
    # Each push-triggered run remains the authoritative verification of its
    # own commit; repository tests cannot substitute for that external run.
    #
    # One ephemeral database is created for the whole job (migration checks
    # and pytest both use it), then dropped in the always-run cleanup step
    # alongside the security-group rule — see tests/conftest.py for the same
    # ephemeral-database pattern used outside CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Open dev access for this runner
        run: |
          RUNNER_CIDR="$(curl -s https://checkip.amazonaws.com)/32"
          echo "RUNNER_CIDR=${RUNNER_CIDR}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ vars.DEV_DB_SECURITY_GROUP_ID }}" \
            --protocol tcp --port 5432 --cidr "${RUNNER_CIDR}"

      - name: Create ephemeral test database
        env:
          DEV_DB_ADMIN_URL: ${{ secrets.DEV_DB_ADMIN_URL }}
        run: uv run python scripts/ci_ephemeral_database.py create

      - name: Run migrations (empty ephemeral database to head)
        run: uv run alembic -c database/alembic.ini upgrade head

      - name: Verify migration state
        run: uv run alembic -c database/alembic.ini current --verbose

      - name: Test downgrade (full round trip to base)
        run: |
          uv run alembic -c database/alembic.ini downgrade base
          uv run alembic -c database/alembic.ini upgrade head

      - name: Seed idempotency (re-running migrations must not change seeded data)
        # Required by DATABASE_CONVENTIONS.md §25.6. The round trip above
        # already re-ran every seed once; this asserts the result is identical
        # to the seed files, catching a seed that inserts duplicates or drifts
        # from its YAML source.
        run: uv run pytest tests/database/test_seed_idempotency.py -q

      - name: Schema comparison (autogenerate must produce empty diff)
        run: uv run alembic -c database/alembic.ini check

      - name: Run full test suite (unit, database, scenario)
        run: uv run pytest -v --tb=short

      # The full test suite's run-to-run duration against real AWS RDS
      # varies enormously (observed anywhere from ~7.5 minutes to over an
      # hour for the same test count — see docs/PHASE9_VERIFICATION.md's
      # CI-anomaly notes), and the credentials from "Configure AWS
      # credentials" above are only valid for the role's session duration
      # (commonly capped at one hour). A slow run can therefore leave the
      # revoke-ingress call below holding an already-expired session,
      # failing with RequestExpired even though every substantive step
      # (migrations, tests) already succeeded — observed on run 31343247142.
      # Re-assuming fresh credentials immediately before cleanup, rather
      # than raising role-duration-seconds and hoping it covers whatever a
      # given run happens to take, keeps this step correct regardless of
      # how long everything before it ran.
      - name: Refresh AWS credentials before cleanup
        if: always()
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Clean up ephemeral database and revoke access
        if: always()
        env:
          DEV_DB_ADMIN_URL: ${{ secrets.DEV_DB_ADMIN_URL }}
          DEV_DB_SECURITY_GROUP_ID: ${{ vars.DEV_DB_SECURITY_GROUP_ID }}
        # scripts/ci_cleanup.py always attempts both the database drop and
        # the ingress revoke, even if the first fails, and exits nonzero if
        # either failed — see that module's docstring and
        # tests/unit/test_ci_cleanup.py for the failure-path proof (against
        # fake operations, not real AWS calls).
        run: uv run python scripts/ci_cleanup.py
