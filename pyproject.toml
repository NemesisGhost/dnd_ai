[project]
name = "dnd-ai"
version = "0.1.0"
description = "Persistent world simulation platform for tabletop RPGs"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.109.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyjwt[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.25",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "hypothesis>=6.92.0",
    "mypy>=1.8.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.14",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# ruff also formats fenced python code blocks inside markdown; scope it to
# actual code so it doesn't rewrite quote style in prose documentation.
extend-exclude = ["docs", ".github"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG",  # Unused function arguments in fixtures
    "S101", # Use of assert
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ has no __init__.py (it's one-off CI/ops scripts, not a package).
# Its modules are invoked directly (e.g. `uv run python scripts/wait_for_ci.py`),
# which picks up scripts/ as sys.path[0]. Adding it here lets a test import
# such a module the same way, rather than testing a reshaped duplicate, if
# one is ever added for a script in this directory.
pythonpath = ["scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# basetemp: NOT set here. A *fixed* basetemp — this project tried both
# the OS temp dir and, later, a fixed path under .tmp/ — can end up owned
# by an ACL a later session (a different Windows sandbox identity, twice
# observed on this project) can neither read, write, nor take ownership
# of, permanently poisoning that name regardless of which fixed path was
# chosen. tests/conftest.py's pytest_configure() hook instead assigns
# each run its own fresh, uniquely named directory under this workspace's
# gitignored .tmp/ — see the detailed comment there — unless --basetemp
# is passed explicitly here or on the command line, which always wins.
#
# cache_dir: pytest's cache plugin has no equivalent per-run mechanism
# available through public configuration (cache_dir is a plain ini value,
# not a config.option.* attribute pytest_configure can override before
# it's read, the way --basetemp's own hook does above) — disabled
# entirely via `-p no:cacheprovider` below rather than risk the exact
# same ACL failure the basetemp fix exists to prevent. Nothing in this
# project's tests or tooling uses --lf/--ff/stepwise or the `cache`
# fixture, so nothing depends on it being enabled.
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-p",
    "no:cacheprovider",
]
markers = [
    "unit: Unit tests with no database",
    "database: Tests requiring PostgreSQL container",
    "scenario: Cross-domain scenario tests",
]
