# Self-hosted deployment topology for the D&D AI World Platform.
# See docs/DEVELOPMENT.md §3 (local/self-hosted setup) and
# docs/adr/0012-self-hosted-docker-deployment-and-ci-verification.md.
#
# This base file is the production/self-hosted default and is deliberately
# conservative:
#   - PostgreSQL is NOT published on any host port. compose.override.yaml
#     (auto-loaded by plain `docker compose ...` commands with no -f flags)
#     adds a 127.0.0.1-only mapping for local development. CI
#     (compose.ci.yaml) is loaded with explicit -f flags and never sees the
#     override, so it never gets one either.
#   - POSTGRES_PASSWORD has no fallback default — `docker compose up` fails
#     immediately if it isn't set, rather than silently starting with a
#     guessable password. Set it in .env (see .env.example).
#   - MIGRATION_DATABASE_URL has no fallback default either — a complete
#     SQLAlchemy URL you supply yourself, kept in sync with
#     POSTGRES_PASSWORD by hand, so a password containing URL-special
#     characters can be percent-encoded correctly instead of being
#     restricted to a "safe" subset. See .env.example.
#
# Usage — this exact order matters, see the `api` service's own comment
# below for why steps 3-4 must both complete before step 5:
#   cp .env.example .env              # then set POSTGRES_PASSWORD, MIGRATION_DATABASE_URL, and API_DATABASE_URL — required; API_OIDC_ISSUER/API_OIDC_AUDIENCE/API_OIDC_JWKS_URL are optional external-bearer-token compatibility, all three together or none
#   docker compose up -d db           # 1. start PostgreSQL (dev: also publishes 127.0.0.1:5432 via the override)
#   docker compose --profile tools run --rm migrate   # 2. apply migrations (creates app_read_write, among five other roles)
#   uv run python scripts/operations/database_recovery.py set-role-password \  # 3. provision app_read_write's password
#     --role app_read_write --password-env-var APP_READ_WRITE_PASSWORD \
#     --project dnd_ai --env-file .env --compose-file compose.yaml
#   # 4. build API_DATABASE_URL from that password (percent-encoded) and set it in .env — see .env.example
#   docker compose up -d api          # 5. start the FastAPI application under Uvicorn (dev: also publishes 127.0.0.1:8000 via the override)
#   docker compose down               # stop; add -v to also drop the data volume
#
# `api` (below) is the FastAPI application (src/dnd_ai/api) under Uvicorn —
# the same image the `migrate` job already builds, with a different
# command selecting this role (docs/DEVELOPMENT.md §2, PLAN.md §31.3). It
# always runs with DND_AI_ENVIRONMENT=production (a fixed literal, not a
# variable — see that service's own comment below). Local application
# authentication (opaque PostgreSQL-backed browser sessions, Argon2id
# passwords, HttpOnly cookies) is this deployment's primary login path and
# needs no OIDC provider at all; API_OIDC_ISSUER/API_OIDC_AUDIENCE/
# API_OIDC_JWKS_URL are optional, all-or-nothing external bearer-token
# compatibility — see that block below for the HTTPS/all-or-nothing rule
# dnd_ai.config.Settings still enforces once any of the three is set. It
# also always connects to PostgreSQL as
# app_read_write, never postgres/migration_runner/migration_owner (see
# that service's DND_AI_DATABASE_URL comment below) — a role with no
# schema-DDL, role-management, or migration_owner-membership privilege at
# all, only DML on application tables. This service's `depends_on: db:
# condition: service_healthy` guarantees PostgreSQL itself is reachable
# before `api` starts, but Compose has no equivalent built-in mechanism
# for a `profiles: ["tools"]` one-off job like `migrate`, or for a step
# external to Compose entirely like `set-role-password` — steps 2 and 3 in
# the Usage sequence above are a documented, must-run-first manual
# sequence, the same way `migrate` already was before this correction pass
# added `set-role-password` to it. `verify-roles` (same script) reports,
# per LOGIN role, whether its password has actually been set — run it
# after step 3 to confirm before proceeding to step 5, and periodically
# thereafter to confirm the deployment stayed correctly provisioned. Like
# `db`, `api` publishes no host port in this base file by design
# (compose.override.yaml adds a 127.0.0.1-only one for local development);
# a real self-hosted deployment reaches it only through a reverse proxy —
# not yet built here, see PLAN.md §32 (Phase 14). No background
# worker/Discord-adapter service exists yet either; add one the same way
# once that role has committed source to run.

services:
  db:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set it before starting the self-hosted stack}
      POSTGRES_DB: ${POSTGRES_DB:-dnd_ai}
    # No `ports:` here by design — see the header comment. Do not add a
    # default host port mapping to this file; use compose.override.yaml
    # (local development) or a deliberate, reviewed override of your own
    # (real external access) instead.
    volumes:
      # PostgreSQL 18's official image changed its data-directory layout:
      # PGDATA now defaults to /var/lib/postgresql/18/docker, versioned
      # under /var/lib/postgresql, not directly at
      # /var/lib/postgresql/data (the pre-18 convention). Mounting
      # .../data here would silently miss where the server actually
      # writes, leaving the named volume empty while data lands on the
      # container's ephemeral layer. Mount the parent directory instead.
      # Do NOT change this back to /var/lib/postgresql/data — see
      # docker-library/postgres's PostgreSQL 18 image notes.
      - type: volume
        source: dnd_ai_pgdata
        target: /var/lib/postgresql
    healthcheck:
      # Deliberately targets the always-present `postgres` maintenance
      # database, not ${POSTGRES_DB} — the documented recovery procedure
      # (docs/DEVELOPMENT.md §3.6) drops and recreates the application
      # database, and a health check connecting to it would either hold a
      # connection that blocks the drop, or report the container unhealthy
      # for the window between drop and recreate (which `depends_on:
      # condition: service_healthy` on the migrate service would then wait
      # on unnecessarily). `postgres` always exists on a running cluster
      # regardless of what happens to the application database, so this
      # reports the server's actual up/down state, not the application
      # database's.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off job, not started by `docker compose up`. Runs Alembic to head
  # against the `db` service, using the same image the `api` service below
  # (and any future worker/adapter service) shares (docs/DEVELOPMENT.md §2).
  # Reaches `db` over the compose-internal network by service name — this
  # needs no published host port.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      # MIGRATION_DATABASE_URL is a complete SQLAlchemy URL you supply
      # yourself (see .env.example) — deliberately NOT assembled from
      # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB above by Compose
      # interpolation, because interpolation is plain string substitution,
      # not a URL encoder: a password containing characters that are
      # special in a URL (@ : / ? # [ ] % and similar) would silently
      # produce a broken connection string. Percent-encode the password
      # segment yourself if it needs one, and keep this in sync with
      # POSTGRES_PASSWORD above by hand — Compose cannot derive one from
      # the other safely.
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required — copy .env.example to .env and set it before running the migrate service}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "-c", "database/alembic.ini", "upgrade", "head"]

  # The FastAPI application (src/dnd_ai/api) under Uvicorn (docs/PLAN.md
  # Phase 10 deliverable "a FastAPI application entry point executed by
  # Uvicorn and containerized as a portable service"; ADR 0013). Built from
  # the same image `migrate` uses — the entrypoint stays `uv run --no-sync`
  # (Dockerfile); only `command:` below selects this role, the same
  # mechanism `migrate`'s own `command:` already uses. Reaches `db` over
  # the compose-internal network by service name, exactly like `migrate` —
  # this service needs no published host port either, and publishes none
  # here by design (see this file's header comment); a real self-hosted
  # deployment sits behind a reverse proxy instead, not yet built (PLAN.md
  # §32, Phase 14). Started by plain `docker compose up` (no `profiles:`
  # restriction) since, unlike `migrate`, it is a standing service, not a
  # one-off job.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "dnd_ai.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # DND_AI_ENVIRONMENT is a fixed literal, never a variable — this file
      # *is* the self-hosted/production deployment topology (this file's
      # own header comment: "the production/self-hosted default"), so the
      # container must never be able to silently boot in dnd_ai.config's
      # "local" default merely because a host-side variable was left unset.
      # "local" skips loading OIDC settings and disables production's
      # fail-closed/HTTPS validation (dnd_ai.config.Settings) — running
      # this container that way previously let it pass /healthz and
      # /readyz while every authenticated route failed closed with a
      # generic 500 (dnd_ai.api.auth.get_jwks_client()'s own assertion that
      # oidc_jwks_url is configured), not the intended 401. Forcing
      # "production" here is what makes the three DND_AI_OIDC_* variables
      # below actually required — see dnd_ai.config's own model_validator.
      DND_AI_ENVIRONMENT: production
      # API_DATABASE_URL is a complete SQLAlchemy URL you supply yourself
      # (see .env.example) — same reasoning as MIGRATION_DATABASE_URL above
      # (percent-encode the password segment; never assembled from
      # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB by Compose
      # interpolation), but a deliberately distinct setting and, unlike
      # MIGRATION_DATABASE_URL, a deliberately DIFFERENT identity: this URL
      # MUST authenticate as app_read_write (001_bootstrap's DML-only
      # login role — SELECT/INSERT/UPDATE/DELETE on application tables,
      # no schema DDL, no role management, no membership in
      # migration_owner) — NEVER postgres, migration_runner, or
      # migration_owner. Provision app_read_write's password with
      # `scripts/operations/database_recovery.py set-role-password --role
      # app_read_write ...` (docs/DEVELOPMENT.md §3.6) after migrations
      # have created the role and before this service ever starts —
      # running the API as a superuser or migration identity is a
      # production security boundary this file enforces by requiring a
      # role-scoped URL here, not an accepted interim state.
      # dnd_ai.config.Settings reads DND_AI_DATABASE_URL specifically —
      # this is the container-side variable name the application process
      # actually looks up, not API_DATABASE_URL itself (that name only
      # exists on the host side, in .env).
      DND_AI_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL is required — copy .env.example to .env and set it before starting the api service. Must authenticate as app_read_write, never postgres/migration_runner/migration_owner}
      # API_OIDC_ISSUER/API_OIDC_AUDIENCE/API_OIDC_JWKS_URL are optional,
      # deployment-supplied external-bearer-token compatibility — point them
      # at a standards-compliant OIDC provider only if this deployment
      # actually wants to accept OIDC-bearer-authenticated API calls
      # alongside local cookie login (see .env.example). Soft `:-` defaults
      # here on purpose, exactly like API_FOUNDRY_ALLOWED_ORIGINS below —
      # dnd_ai.config.Settings treats a blank value identically to
      # unconfigured (never a validation error), and local application
      # authentication needs none of the three. If you do set one, you must
      # set all three — dnd_ai.config.Settings still enforces that
      # all-or-nothing rule unconditionally, and, since this file always
      # runs `api` with DND_AI_ENVIRONMENT=production, requires the issuer
      # and JWKS URL to be HTTPS with no embedded credentials or fragment —
      # see that module's own docstring for the full validation this
      # enforces.
      DND_AI_OIDC_ISSUER: ${API_OIDC_ISSUER:-}
      DND_AI_OIDC_AUDIENCE: ${API_OIDC_AUDIENCE:-}
      DND_AI_OIDC_JWKS_URL: ${API_OIDC_JWKS_URL:-}
      # Phase 11R workstream A/B: the exact-origin allowlist a cookie-
      # authenticated, state-changing local-session request's Origin header
      # is checked against (docs/PLAN.md §23.4; see .env.example's "Local
      # authentication" section). Unlike API_FOUNDRY_ALLOWED_ORIGINS below,
      # this has no safe soft default in production — local authentication
      # is not an opt-in feature the way Foundry integration is, so
      # dnd_ai.config.Settings requires it unconditionally whenever
      # DND_AI_ENVIRONMENT=production (which this file always sets for
      # `api`), with no fallback, and requires every origin to be HTTPS.
      DND_AI_LOCAL_SESSION_ALLOWED_ORIGINS: ${API_LOCAL_SESSION_ALLOWED_ORIGINS:?API_LOCAL_SESSION_ALLOWED_ORIGINS is required — copy .env.example to .env and set it to the portal's real HTTPS origin before starting the api service}
      # Phase 13B correction: the exact IP addresses/CIDR networks trusted
      # to set X-Forwarded-For on an inbound request (see .env.example's
      # "Trusted reverse proxy" section and dnd_ai.config's own docstring).
      # Safe soft default (`:-`, blank) on purpose, exactly like
      # API_FOUNDRY_ALLOWED_ORIGINS below — this base file, as documented
      # at its own header, sits behind no reverse proxy yet (PLAN.md §32,
      # Phase 14), so "trust nothing" (dnd_ai.config.Settings' own default)
      # is correct until an operator actually places one in front of `api`.
      # Once you do, this MUST name that proxy's address before exposing
      # login publicly through it — left unset, the IP-wide login rate
      # limiter (dnd_ai.api.local_auth.get_login_ip_rate_limiter) degrades
      # to one shared bucket keyed on the proxy's own address across every
      # real client behind it, since request.client.host is then always
      # the proxy, never the true caller (dnd_ai.api.client_address's own
      # docstring).
      DND_AI_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      # Issue 1's CORS fix: the explicit allowlist of browser origins the
      # FoundryVTT module is served from (see .env.example's "Foundry CORS"
      # section). Optional soft defaults here on purpose — most self-hosted
      # deployments don't run FoundryVTT at all — but both defaults are
      # deliberately *safe*, never permissive: an unset feature flag stays
      # `false`, and an unset allowlist stays empty (dnd_ai.config.Settings
      # treats an empty string identically to "unconfigured" — no cross-
      # origin browser access, never a wildcard). If you set
      # API_FEATURE_FOUNDRY_INTEGRATION=true, dnd_ai.config.Settings then
      # requires API_FOUNDRY_ALLOWED_ORIGINS to be set too, with no
      # fallback, and requires every origin in it to be HTTPS (this file
      # always runs `api` with DND_AI_ENVIRONMENT=production).
      DND_AI_FEATURE_FOUNDRY_INTEGRATION: ${API_FEATURE_FOUNDRY_INTEGRATION:-false}
      DND_AI_FOUNDRY_ALLOWED_ORIGINS: ${API_FOUNDRY_ALLOWED_ORIGINS:-}
      # Phase 12 AI provider (see .env.example's "AI provider" section for
      # the full explanation). Same soft-default posture as the Foundry
      # block above: the feature flag stays off, the base URL defaults to
      # real hosted OpenAI, the model defaults to gpt-4o, and the key stays
      # unset — dnd_ai.config.Settings is what actually refuses to start
      # (DND_AI_ENVIRONMENT=production above) once
      # DND_AI_FEATURE_AI_NPC_DIALOGUE=true, DND_AI_AI_PROVIDER_BASE_URL is
      # still the hosted default, and no key is configured (env var or
      # mounted secret). Point API_AI_PROVIDER_BASE_URL at a locally hosted,
      # OpenAI-API-compatible model server (Ollama, vLLM, LM Studio, ...)
      # for the "local model" path instead — that operator-controlled
      # server may need no key at all. dnd_ai.config.Settings treats a
      # blank DND_AI_AI_PROVIDER_API_KEY (this file's own `:-` fallback
      # when API_AI_PROVIDER_API_KEY is unset) identically to it being
      # absent — never as a real, empty credential.
      #
      # Prefer a mounted secret over API_AI_PROVIDER_API_KEY for a real
      # hosted-OpenAI key: mount it at
      # ${DND_AI_SECRETS_DIR}/dnd_ai_ai_provider_api_key inside this
      # container (the same generic host-mounted-secret-file mechanism
      # DND_AI_DATABASE_URL's own secret file already uses —
      # dnd_ai.config.Settings' secrets_dir applies to every field, not only
      # database_url) and leave API_AI_PROVIDER_API_KEY unset in .env — an
      # environment variable set here is still visible via `docker
      # inspect`/`docker compose config`, which a mounted file is not.
      DND_AI_FEATURE_AI_NPC_DIALOGUE: ${API_FEATURE_AI_NPC_DIALOGUE:-false}
      DND_AI_AI_PROVIDER_BASE_URL: ${API_AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      DND_AI_AI_PROVIDER_MODEL: ${API_AI_PROVIDER_MODEL:-gpt-4o}
      DND_AI_AI_PROVIDER_API_KEY: ${API_AI_PROVIDER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /healthz is deliberately DB-independent (dnd_ai.api.app's own
      # docstring) — cheap process liveness only, not a readiness probe.
      # `python` resolves via this image's own PATH (Dockerfile: `PATH=
      # "/app/.venv/bin:${PATH}"`) without needing `uv run`, since a Docker
      # HEALTHCHECK exec bypasses ENTRYPOINT entirely; no curl/wget exists
      # in this python:3.12-slim-bookworm base image, so this uses only the
      # Python standard library already available in the image.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # Persistent by default — normal self-hosted use expects data to survive
  # `docker compose down`/restarts. Backup and upgrade responsibilities for
  # this volume: docs/DEVELOPMENT.md §3.6.
  #
  # Deliberately not given an explicit top-level `name:` — Compose then
  # scopes the real volume name by project (COMPOSE_PROJECT_NAME / `-p`),
  # so a verification run under a throwaway project name can never collide
  # with, inspect, or delete a real deployment's data. If you need a
  # predictable name for backup tooling, set COMPOSE_PROJECT_NAME rather
  # than pinning `name:` here.
  dnd_ai_pgdata: {}
