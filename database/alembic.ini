# Alembic configuration
#
# For project documentation, see docs/DEVELOPMENT.md §4 and §5.
# For migration conventions, see docs/DATABASE_CONVENTIONS.md §25.

[alembic]
# Path to migration scripts
script_location = migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# as well as the filename
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected
# as revisions in the versions/ directory
# sourceless = false

# Version location specification — used for Alembic autogenerate
# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# Version path separator; defaults to OS-specific separator
# version_path_separator = :
# version_path_separator = ;

# Set to 'true' to search source files recursively in each "version_locations" directory
# recursive_version_locations = false

# The output encoding used when revision files are written
# output_encoding = utf-8

# Alembic stores its version_table in the schema specified here.
# This project uses NO tables in public (docs/DATABASE_CONVENTIONS.md §3.1).
version_table_schema = core

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
